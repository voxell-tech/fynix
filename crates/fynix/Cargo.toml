[package]
name = "fynix"
description = "A reactive element tree: watchers, bindings, and transitions over a backend world."
exclude = ["/examples/"]
keywords = ["reactive", "element", "ui", "tree", "agnostic"]
categories = ["no-std", "gui"]
readme = "./README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lenz = { workspace = true }
fynix_macros = { workspace = true }
hashbrown = { workspace = true, features = ["default-hasher"] }
motiongfx_interp = { workspace = true }
typarena = { workspace = true }

[lints]
workspace = true
