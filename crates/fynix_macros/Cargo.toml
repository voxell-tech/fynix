[package]
name = "fynix_macros"
description = "Derive macros for fynix."
keywords = ["fynix", "element", "derive", "macro"]
categories = ["gui", "development-tools::procedural-macro-helpers"]
readme = "./README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro-crate = "3"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["derive", "full"] }

[lints]
workspace = true
