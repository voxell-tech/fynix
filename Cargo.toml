[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/fynix"

[workspace.dependencies]
# fynix
fynix = { version = "0.0.1", path = "crates/fynix", default-features = false }
bevy_fynix = { version = "0.0.1", path = "crates/bevy_fynix", default-features = false }

# motiongfx
# `main` until a release rounds integers without `std` (motiongfx #187).
motiongfx_interp = { git = "https://github.com/voxell-tech/motiongfx", rev = "2914a36c1132a3ac7c46e12186299ec2434ad055", default-features = false }

# bevy
bevy = { version = "0.19", default-features = false }

# other
lenz = { version = "0.1.0", default-features = false }
typarena = { version = "0.1.2", features = ["send", "sync"] }
hashbrown = { version = "0.17", default-features = false }

[workspace.lints.clippy]
redundant_type_annotations = "warn"
