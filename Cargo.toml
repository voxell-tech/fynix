[workspace]
members = ["crates/*", "examples/*"]
exclude = ["vendor/"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/voxell-tech/fynix"

[workspace.dependencies]
fynix = { path = "crates/fynix" }
fynix_macros = { path = "crates/fynix_macros" }
fynix_elements = { path = "crates/fynix_elements" }

rectree = { git = "https://github.com/voxell-tech/rectree", rev = "08ddf2a" }
field_path = "0.4.1"
parley = { version = "0.7.0", default-features = false, features = ["libm"] }
imaging = "0.0.1"
imaging_vello = "0.0.1"

typeslot = { version = "0.3.0", git = "https://github.com/voxell-tech/typeslot", rev = "ead9111" }
sparse_map = "0.1.2"
vello = "0.8.0"
winit = "0.30"
pollster = "0.4.0"
hashbrown = "0.16.1"
